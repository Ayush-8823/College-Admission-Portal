<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admission Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="container py-5">


<h1 class="text-center mb-5">
    College Admission Form
</h1>


<form method="POST" action="/admission" enctype="multipart/form-data">


<div class="row">


<div class="col-md-6 mb-3">

<label>
Full Name
</label>

<input type="text" 
class="form-control"
name="name"
required>

</div>



<div class="col-md-6 mb-3">

<label>
Father Name
</label>

<input type="text"
class="form-control"
name="father"
required>

</div>



<div class="col-md-6 mb-3">

<label>
Email
</label>

<input type="email"
class="form-control"
name="email"
required>

</div>



<div class="col-md-6 mb-3">

<label>
Mobile Number
</label>

<input type="text"
class="form-control"
name="mobile"
required>

</div>



<div class="col-md-6 mb-3">

<label>
Date of Birth
</label>

<input type="date"
class="form-control"
name="dob">

</div>



<div class="col-md-6 mb-3">

<label>
Select Course
</label>

<select class="form-control" name="course">

<option>BCA</option>
<option>B.Tech</option>
<option>BBA</option>
<option>B.Com</option>
<option>MCA</option>
<option>MBA</option>

</select>

</div>



<div class="col-12 mb-3">

<label>
Address
</label>

<textarea class="form-control"
name="address"></textarea>

</div>


<div class="col-12 mb-3">

<label>
Upload Photo
</label>

<input type="file"
class="form-control"
name="photo">

</div>


</div>


<button type="submit" class="btn btn-primary w-100">
Submit Application
</button>

</form>


</div>


</body>

</html>
